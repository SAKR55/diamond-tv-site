<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقسيم المصاريف وتسوية الحساب | DIAMOND HUB</title><meta name="description" content="أدخل ما دفعه كل مشارك وحدد المستفيدين من كل مصروف لمعرفة التحويلات المطلوبة — مجانًا وبالعربية على DIAMOND HUB."><link rel="canonical" href="https://diamond-tv.shop/tools/shared-expense-settlement/"><link rel="stylesheet" href="/prompt-studio/academy.css"><style>figure{margin:12px 0}figure img{max-width:100%;max-height:480px;object-fit:contain}pre{direction:rtl;white-space:pre-wrap}#people{display:flex;gap:14px;flex-wrap:wrap}[hidden]{display:none!important}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1133894458639371" crossorigin="anonymous"></script></head><body><header><nav><a href="/">DIAMOND HUB</a><a href="/tools/">دليل الأدوات</a><a href="/articles/">المقالات</a></nav></header><main><h1>تقسيم المصاريف وتسوية الحساب</h1><p>أدخل ما دفعه كل مشارك وحدد المستفيدين من كل مصروف لمعرفة التحويلات المطلوبة.</p><form class="box" id="work"><label>أسماء المشاركين · اسم مختلف في كل سطر<textarea id="names" rows="4" placeholder="سارة&#10;علي&#10;منى"></textarea></label><button type="button" id="set">اعتماد الأسماء</button><p id="roster"></p><div id="entry" hidden><div class="grid"><label>وصف المصروف<input id="desc" placeholder="مثلًا، العشاء"></label><label>المبلغ بالريال<input id="amount" type="number" min=".01" max="100000000" step=".01"></label><label>من دفع؟<select id="payer"></select></label></div><fieldset><legend>قسّم هذا المصروف بالتساوي بين</legend><div id="people"></div></fieldset><button type="button" id="add">أضف المصروف</button><ul id="list"></ul><button>احسب التسوية</button></div><pre id="statement" hidden></pre></form><output id="msg" aria-live="polite"></output><a id="download" class="action" hidden>نزّل النتيجة</a><p><a href="/articles/settle-shared-trip-expenses/">كيف تسوّي مصاريف رحلة عندما لا يشترك الجميع في كل دفعة؟</a></p></main><script>const el=id=>document.getElementById(id);const form=el('work');let version=0,url='';function clearResult(){version++;if(url)URL.revokeObjectURL(url);url='';el('download').hidden=true;el('msg').textContent='';for(const id of ['statement','preview'])if(el(id))el(id).hidden=true}function ready(blob,name){url=URL.createObjectURL(blob);el('download').href=url;el('download').download=name;el('download').hidden=false}form.addEventListener('input',clearResult);form.onsubmit=async e=>{e.preventDefault();clearResult();const job=version;try{await run(job)}catch(error){if(job===version)el('msg').textContent=error.message}};function report(text){el('statement').textContent=text;el('statement').hidden=false}function requireNumber(id){const s=el(id).value.trim();if(!s||!Number.isFinite(Number(s)))throw Error('أكمل الحقول الرقمية المطلوبة.');return Number(s)};let names=[],expenses=[];function draw(){el('list').replaceChildren();expenses.forEach((x,i)=>{let li=document.createElement('li'),btn=document.createElement('button');li.append(x.desc+' · '+(x.cents/100).toFixed(2)+' · دفع '+names[x.payer]+' · المشاركون: '+x.members.map(j=>names[j]).join('، ')+' ');btn.type='button';btn.textContent='إزالة';btn.onclick=()=>{expenses.splice(i,1);clearResult();draw()};li.append(btn);el('list').append(li)});el('names').readOnly=expenses.length>0;el('set').disabled=expenses.length>0}
el('set').onclick=()=>{const items=el('names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);clearResult();if(items.length<2||new Set(items).size!==items.length){el('msg').textContent='أدخل اسمين مختلفين على الأقل، دون تكرار.';el('entry').hidden=true;return}names=items;el('payer').replaceChildren();el('people').replaceChildren();items.forEach((s,i)=>{el('payer').add(new Option(s,String(i)));let label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.value=i;label.append(cb,' '+s);el('people').append(label)});el('entry').hidden=false;el('roster').textContent='المشاركون المعتمدون: '+items.join('، ');draw()};el('names').addEventListener('input',()=>{el('entry').hidden=true;el('roster').textContent='اعتمد الأسماء بعد تعديلها.'});
el('add').onclick=()=>{clearResult();let members=Array.from(el('people').querySelectorAll(':checked'),c=>Number(c.value)),desc=el('desc').value.trim(),val=el('amount').value;if(!desc||!val||Number(val)<=0||!el('amount').checkValidity()||!members.length){el('msg').textContent='أدخل وصفًا ومبلغًا موجبًا بمنزلتين عشريتين كحد أقصى واختر مستفيدًا واحدًا على الأقل.';return}expenses.push({desc,cents:Math.round(Number(val)*100),payer:Number(el('payer').value),members});el('desc').value='';el('amount').value='';draw()};function settle(count,entries){let balances=Array(count).fill(0);for(const x of entries){balances[x.payer]+=x.cents;const base=Math.floor(x.cents/x.members.length),extra=x.cents%x.members.length;x.members.forEach((k,i)=>balances[k]-=base+(i<extra?1:0))}const left=balances.slice(),moves=[];let d=0,c=0;while(d<count&&c<count){if(left[d]>=0){d++;continue}if(left[c]<=0){c++;continue}const amount=Math.min(-left[d],left[c]);moves.push([d,c,amount]);left[d]+=amount;left[c]-=amount}return {balances,moves}}function run(){if(!expenses.length)throw Error('أضف مصروفًا واحدًا على الأقل.');if(el('amount').value||el('desc').value.trim())throw Error('أضف المصروف الجاري أو أفرغ وصفه ومبلغه قبل الحساب.');const {balances,moves}=settle(names.length,expenses);const money=v=>(v/100).toFixed(2)+' ريال';const lines=['سجل المصروفات',...expenses.map(x=>x.desc+' · '+money(x.cents)+' · دفع '+names[x.payer]+' · عن '+x.members.map(j=>names[j]).join('، ')),'','صافي الأرصدة',...balances.map((v,i)=>names[i]+' · '+(v>0?'له ':v<0?'عليه ':'متوازن ')+money(Math.abs(v))),'','تحويلات التسوية',...(moves.length?moves.map(([a,b,m])=>names[a]+' يدفع إلى '+names[b]+' '+money(m)):['الحساب متوازن.'])];let text=lines.join('\n');report(text);ready(new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}),'shared-expenses.txt')}</script></body></html>
