<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصمم سلسلة برومبتات ChatGPT | DIAMOND HUB</title><meta name="description" content="قسّم مهمتك إلى استخراج أدلة وإعداد مسودة ثم مراجعة وتسليم — مجانًا وبالعربية على DIAMOND HUB."><link rel="canonical" href="https://diamond-tv.shop/tools/chatgpt-workflow/"><link rel="stylesheet" href="/prompt-studio/academy.css"><style>fieldset{border:1px solid #ccc;border-radius:10px;margin:14px 0}textarea{max-width:100%}fieldset .grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1133894458639371" crossorigin="anonymous"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/tool-theme.css"></head><body><div class="dh-top"><a class="lg" href="/">💎 DIAMOND HUB</a><a href="/tools/">الأدوات</a><a href="/accounting/">المحاسبة</a><a href="/articles/">المقالات</a></div><header><nav><a href="/tools/#ai">دليل الأدوات</a><a href="/prompt-studio/">مختبر ChatGPT</a><a href="/prompt-studio/course/">الكورس</a></nav></header><main><h1>مصمم سلسلة برومبتات ChatGPT</h1><p>قسّم مهمتك إلى استخراج أدلة وإعداد مسودة ثم مراجعة وتسليم.</p><form class="box" id="form"><label for="goal">الهدف النهائي</label><textarea id="goal" rows="3"></textarea><label for="data">المادة المرجعية</label><textarea id="data" rows="3"></textarea><label for="test">متى تعتبر النتيجة مقبولة؟</label><textarea id="test" rows="3"></textarea><label>المرحلة<select id="stage"><option>استخراج الأدلة</option><option>إعداد المسودة</option><option>مراجعة وتسليم</option></select></label><div id="handoff" hidden><label for="prior">مخرج المرحلة السابقة</label><textarea id="prior" rows="3"></textarea></div><button>أنشئ طلب المرحلة</button></form><output id="msg" aria-live="polite"></output><section id="panel" class="box" hidden><label for="out">النتيجة القابلة للتعديل</label><textarea id="out" rows="12"></textarea><button id="copy">نسخ</button><button id="save">تنزيل نص</button></section></main><script>const el=id=>document.getElementById(id);function need(id){const v=el(id).value.trim();if(!v){el(id).focus();throw Error('أكمل الحقل المحدد ثم أعد المحاولة.')}return v}function clear(){el('panel').hidden=true;el('out').value='';el('msg').textContent=''}el('form').addEventListener('input',clear);el('form').onsubmit=e=>{e.preventDefault();clear();try{el('out').value=generate();el('panel').hidden=false;el('msg').textContent='النتيجة جاهزة للمراجعة.'}catch(e){el('msg').textContent=e.message}};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('out').value);el('msg').textContent='تم النسخ.'}catch{el('out').select();el('msg').textContent='تم تحديد النص. استخدم أمر النسخ.'}};el('save').onclick=()=>{const url=URL.createObjectURL(new Blob([el('out').value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};let stage=0;const previous=['','',''];el('stage').onchange=()=>{previous[stage]=el('prior').value;stage=el('stage').selectedIndex;el('prior').value=previous[stage];el('handoff').hidden=!stage;clear()};function generate(){const goal=need('goal'),data=need('data'),test=need('test');const verbs=['استخرج الحقائق والقيود والمعلومات الناقصة. اربط كل حقيقة بعبارة من المادة واجمع أسئلة التوضيح.','استخدم الاستخراج السابق لإعداد مسودة تحقق الهدف. اذكر أي افتراض وافصل الأسئلة المفتوحة عن الحقائق.','دقق المسودة أمام المادة ومعيار القبول بندًا بندًا. سلّم نسخة منقحة وجدولًا بالتغييرات وأسبابها.'];const parts=['المرحلة '+(stage+1)+' من 3',verbs[stage],'الهدف: '+goal,'معيار القبول: '+test,'المادة المرجعية:',data];if(stage)parts.push('مخرج المرحلة السابقة:',need('prior'));return parts.join('\n\n')}</script></body></html>
