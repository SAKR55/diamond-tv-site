var F=[['ca','أصول متداولة',500000],['inv','المخزون',150000],['cash','النقد وما يعادله',120000],['ar','ذمم مدينة',180000],['ta','إجمالي الأصول',1200000],['cl','التزامات متداولة',300000],['tl','إجمالي الالتزامات',700000],['eq','حقوق الملكية',500000],['rev','الإيرادات',2000000],['cogs','تكلفة المبيعات',1300000],['ebit','الربح التشغيلي',250000],['ni','صافي الربح',180000],['int','مصروف الفوائد',30000],['ap','ذمم دائنة',140000]];

 ['النشاط','أيام السداد DPO',d(v.ap,v.cogs)*365,'يوم',rate(d(v.ap,v.cogs)*365,45,20,1),'المدة التي تستغرقها لسداد الموردين.'],

 ['الرافعة','الالتزامات ÷ حقوق الملكية',d(v.tl,v.eq),'x',rate(d(v.tl,v.eq),1,2,0),'فوق 2 رافعة مرتفعة.'],
 ['الرافعة','تغطية الفوائد',d(v.ebit,v.int),'x',rate(d(v.ebit,v.int),4,2,1),'الربح التشغيلي ÷ الفوائد؛ أقل من 2 خطر.']];
 var h='<h2>النتائج</h2><div style="overflow-x:auto"><table class="rt"><thead><tr><th>الفئة</th><th>النسبة</th><th>القيمة</th><th>التقييم</th><th>التفسير</th></tr></thead><tbody>'+R.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="n">'+nf(r[2])+' '+r[3]+'</td><td><span class="bd '+r[4]+'">'+BN[r[4]]+'</span></td><td>'+r[5]+'</td></tr>'}).join('')+'</tbody></table></div>';
 var m=d(v.ni,v.rev),at=d(v.rev,v.ta),lv=d(v.ta,v.eq);h+='<h2 style="margin-top:16px">تحليل DuPont للعائد على حقوق الملكية</h2><p>ROE = هامش الربح ('+nf(m*100)+'%) × دوران الأصول ('+nf(at)+') × الرافعة ('+nf(lv)+') = <b>'+nf(m*at*lv*100)+'%</b></p>';
 var rec=[];if(R[0][4]==='r')rec.push('السيولة ضعيفة: سرّع التحصيل، فاوض على آجال الموردين، وقلّل المخزون الراكد.');if(R[10][4]==='r')rec.push('أيام التحصيل طويلة: شدّد سياسة الائتمان وأرسل تذكيرات مبكرة وفكّر في خصم السداد المبكر.');if(R[9][4]==='r')rec.push('المخزون يبقى طويلًا: راجع الأصناف الراكدة وخطط الشراء.');if(R[5][4]==='r')rec.push('هامش الربح منخفض: راجع التسعير وتكاليف التشغيل وتركيبة المنتجات.');if(R[14][4]==='r'||R[15][4]==='r')rec.push('المديونية مرتفعة: ركّز على تخفيضها أو إعادة هيكلة التمويل قبل التوسع.');if(R[15][4]==='r')rec.push('تغطية الفوائد ضعيفة: الأرباح بالكاد تغطي الفوائد.');if(!rec.length)rec.push('المؤشرات العامة مقبولة. قارنها بمتوسط قطاعك وبفترات سابقة لرصد الاتجاه.');
