<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ضبط توقيت ملف الترجمة SRT | DIAMOND HUB</title><meta name="description" content="صحّح تأخيرًا ثابتًا أو انحرافًا يتزايد مع مدة الفيديو ثم نزّل الترجمة المعدّلة."><link rel="canonical" href="https://diamond-tv.shop/tools/subtitle-timing-editor/"><link rel="stylesheet" href="/prompt-studio/academy.css"><style>figure{margin:12px 0}figure img{max-width:100%;max-height:480px;object-fit:contain}pre{direction:rtl;white-space:pre-wrap}#people{display:flex;gap:14px;flex-wrap:wrap}[hidden]{display:none!important}</style></head><body><header><nav><a href="/">DIAMOND HUB</a><a href="/tools/">دليل الأدوات</a><a href="/articles/">المقالات</a></nav></header><main><h1>ضبط توقيت ملف الترجمة SRT</h1><p>صحّح تأخيرًا ثابتًا أو انحرافًا يتزايد مع مدة الفيديو ثم نزّل الترجمة المعدّلة.</p><form class="box" id="work"><label>ملف SRT بترميز UTF-8<input type="file" id="file" accept=".srt,text/plain" required></label><label>طريقة التصحيح<select id="mode"><option value="offset">فرق ثابت لكل المقاطع</option><option value="scale">مزامنة بنقطتين</option></select></label><div id="fixed"><label>الإزاحة بالثواني · الموجب يؤخّر الظهور<input type="number" step=".001" id="delay" value="1.5"></label></div><div id="anchors" class="grid" hidden><label>وقت السطر الأول في الملف (ثانية)<input type="number" min="0" step=".001" value="10" id="a0"></label><label>وقته الصحيح في الفيديو (ثانية)<input type="number" min="0" step=".001" value="11" id="a1"></label><label>وقت السطر الثاني في الملف (ثانية)<input type="number" min="0" step=".001" value="610" id="a2"></label><label>وقته الصحيح في الفيديو (ثانية)<input type="number" min="0" step=".001" value="613" id="a3"></label></div><button>عاين التوقيت الجديد</button><pre id="statement" hidden></pre></form><output id="msg" aria-live="polite"></output><a id="download" class="action" hidden>نزّل النتيجة</a><p><a href="/articles/fix-subtitle-timing-srt/">كيف تضبط توقيت الترجمة إذا بدأ مضبوطًا ثم انحرف؟</a></p></main><script>const el=id=>document.getElementById(id);const form=el('work');let version=0,url='';function clearResult(){version++;if(url)URL.revokeObjectURL(url);url='';el('download').hidden=true;el('msg').textContent='';for(const id of ['statement','preview'])if(el(id))el(id).hidden=true}function ready(blob,name){url=URL.createObjectURL(blob);el('download').href=url;el('download').download=name;el('download').hidden=false}form.addEventListener('input',clearResult);form.onsubmit=async e=>{e.preventDefault();clearResult();const job=version;try{await run(job)}catch(error){if(job===version)el('msg').textContent=error.message}};function report(text){el('statement').textContent=text;el('statement').hidden=false}function requireNumber(id){const s=el(id).value.trim();if(!s||!Number.isFinite(Number(s)))throw Error('أكمل الحقول الرقمية المطلوبة.');return Number(s)};el('mode').onchange=()=>{el('anchors').hidden=el('mode').value!=='scale';el('fixed').hidden=!el('anchors').hidden};function ms(h,m,s,f){return ((Number(h)*60+Number(m))*60+Number(s))*1000+Number(f)}function fmt(v){const pad=(n,l)=>String(n).padStart(l,'0');return pad(Math.floor(v/3600000),2)+':'+pad(Math.floor(v/60000)%60,2)+':'+pad(Math.floor(v/1000)%60,2)+','+pad(v%1000,3)}
function retime(raw,scale,offset){const blocks=raw.replace(/^\uFEFF/,'').trim().replace(/\r\n?/g,'\n').split(/\n[ \t]*\n+/),out=[],examples=[];let dropped=0,trimmed=0;for(const [idx,block] of blocks.entries()){const lines=block.split('\n');if(/^\d+\s*$/.test(lines[0]))lines.shift();const time=lines.shift(),m=/^(\d{2,}):([0-5]\d):([0-5]\d)[,.](\d{3})\s*-->\s*(\d{2,}):([0-5]\d):([0-5]\d)[,.](\d{3})([^\n]*)$/.exec(time);if(!m||!lines.join('').trim())throw Error('تنسيق غير مكتمل في المقطع '+(idx+1));let start=ms(...m.slice(1,5)),end=ms(...m.slice(5,9));if(end<=start)throw Error('النهاية تسبق البداية أو تساويها في المقطع '+(idx+1));let a=Math.round(start*scale+offset),b=Math.round(end*scale+offset);if(b<=0){dropped++;continue}if(a<0){a=0;trimmed++}if(b<=a)b=a+1;const row=fmt(a)+' --> '+fmt(b)+m[9];out.push([out.length+1,row,...lines].join('\r\n'));if(examples.length<3)examples.push(time+' ← '+row)}if(!out.length)throw Error('جميع المقاطع قبل بداية الفيديو. راجع الإزاحة.');return {text:out.join('\r\n\r\n')+'\r\n',summary:'المقاطع الناتجة: '+out.length+' · المحذوفة قبل الصفر: '+dropped+' · بدايات قُصّت عند الصفر: '+trimmed+'\n'+examples.join('\n')}}
async function run(job){const file=el('file').files[0];if(!file||file.size>5000000)throw Error('اختر ملف SRT أصغر من 5 ميغابايت.');let scale=1,offset;if(el('mode').value==='offset')offset=requireNumber('delay')*1000;else{const [a,b,c,d]=[0,1,2,3].map(i=>requireNumber('a'+i));if(Math.min(a,b,c,d)<0||c<=a||d<=b)throw Error('يجب أن تكون النقطة الثانية بعد الأولى في التوقيتين.');scale=(d-b)/(c-a);offset=(b-a*scale)*1000}const raw=await file.text();if(job!==version)return;const result=retime(raw,scale,offset);report(result.summary);ready(new Blob(['\uFEFF'+result.text],{type:'application/x-subrip;charset=utf-8'}),file.name.replace(/\.srt$/i,'')+'-synced.srt')}</script></body></html>
