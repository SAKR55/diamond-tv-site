<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجهيز شيت للتحليل في ChatGPT | DIAMOND HUB</title><meta name="description" content="الصق خلايا من Excel، وحدّد الأعمدة، ثم راجع البيانات الداخلة في البرومبت — مجانًا وبالعربية على DIAMOND HUB."><link rel="canonical" href="https://diamond-tv.shop/tools/chatgpt-sheet-brief/"><link rel="stylesheet" href="/prompt-studio/academy.css"><style>fieldset{border:1px solid #ccc;border-radius:10px;margin:14px 0}textarea{max-width:100%}fieldset .grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1133894458639371" crossorigin="anonymous"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/tool-theme.css"></head><body><div class="dh-top"><a class="lg" href="/">💎 DIAMOND HUB</a><a href="/tools/">الأدوات</a><a href="/accounting/">المحاسبة</a><a href="/articles/">المقالات</a></div><header><nav><a href="/tools/#ai">دليل الأدوات</a><a href="/prompt-studio/">مختبر ChatGPT</a><a href="/prompt-studio/course/">الكورس</a></nav></header><main><h1>تجهيز شيت للتحليل في ChatGPT</h1><p>الصق خلايا من Excel، وحدّد الأعمدة، ثم راجع البيانات الداخلة في البرومبت.</p><form class="box" id="form"><p>انسخ نطاق الخلايا مع صف العناوين من Excel أو Google Sheets. يقبل الجدول أعمدة مفصولة بعلامة تبويب.</p><label for="data">الجدول المنسوخ</label><textarea id="data" rows="3"></textarea><button type="button" id="read">اقرأ الأعمدة</button><fieldset hidden id="picker"><legend>الأعمدة الداخلة في الطلب</legend><div id="choices"></div><small id="rows"></small></fieldset><label for="goal">سؤال التحليل</label><textarea id="goal" rows="3"></textarea><button>أنشئ برومبت التحليل</button></form><output id="msg" aria-live="polite"></output><section id="panel" class="box" hidden><label for="out">النتيجة القابلة للتعديل</label><textarea id="out" rows="12"></textarea><button id="copy">نسخ</button><button id="save">تنزيل نص</button></section></main><script>const el=id=>document.getElementById(id);function need(id){const v=el(id).value.trim();if(!v){el(id).focus();throw Error('أكمل الحقل المحدد ثم أعد المحاولة.')}return v}function clear(){el('panel').hidden=true;el('out').value='';el('msg').textContent=''}el('form').addEventListener('input',clear);el('form').onsubmit=e=>{e.preventDefault();clear();try{el('out').value=generate();el('panel').hidden=false;el('msg').textContent='النتيجة جاهزة للمراجعة.'}catch(e){el('msg').textContent=e.message}};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('out').value);el('msg').textContent='تم النسخ.'}catch{el('out').select();el('msg').textContent='تم تحديد النص. استخدم أمر النسخ.'}};el('save').onclick=()=>{const url=URL.createObjectURL(new Blob([el('out').value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};let matrix;function parseTSV(s){const rows=[];let cells=[],v='',quoted=false,closed=false;function cell(){cells.push(v);v='';closed=false}function row(){cell();rows.push(cells);cells=[]}for(let i=0;i<s.length;i++){const c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"'){quoted=false;closed=true}else v+=c}else if(c==='\t')cell();else if(c==='\r'||c==='\n'){if(c==='\r'&&s[i+1]==='\n')i++;row()}else if(closed)throw Error('تأكد من اقتباس الخلايا متعددة الأسطر.');else if(c==='"'&&!v)quoted=true;else v+=c}if(quoted)throw Error('خلية مقتبسة غير مكتملة.');if(v||closed||cells.length)row();return rows}el('data').addEventListener('input',()=>{matrix=null;el('picker').hidden=true});el('read').onclick=()=>{clear();matrix=null;el('picker').hidden=true;try{let raw=el('data').value;if(raw.length>500000)throw Error('استخدم عينة أصغر من 500 ألف حرف.');const rows=parseTSV(raw);if(rows.length<2||rows[0].length<2||rows.some(r=>r.length!==rows[0].length))throw Error('الصق نطاقًا من عمودين على الأقل مع عناوين وصف بيانات وبعدد أعمدة ثابت.');matrix=rows;el('choices').replaceChildren();matrix[0].forEach((h,i)=>{const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value=i;label.append(box,' '+(h||'بلا عنوان')+' · عمود '+(i+1));el('choices').append(label)});el('rows').textContent=(rows.length-1)+' صف بيانات';el('picker').hidden=false}catch(e){el('msg').textContent=e.message}};function generate(){const goal=need('goal');if(!matrix)throw Error('اقرأ الأعمدة أولًا.');const cols=Array.from(el('choices').querySelectorAll(':checked'),n=>Number(n.value));if(!cols.length)throw Error('حدّد الأعمدة التي تحتاجها.');return ['سؤال التحليل: '+goal,'الصف الأول يحوي العناوين. افحص الصفوف الناقصة أو المتكررة، ثم اشرح طريقة الحساب وراجع الإجمالي. استند إلى البيانات التالية:',JSON.stringify(matrix.map(row=>cols.map(i=>row[i])),null,2)].join('\n\n')}</script></body></html>
