<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقارنة إجابات ChatGPT | DIAMOND HUB</title><meta name="description" content="قيّم نسختين بأوزان الدقة والاكتمال والوضوح واحفظ تقرير المفاضلة — مجانًا وبالعربية على DIAMOND HUB."><link rel="canonical" href="https://diamond-tv.shop/tools/chatgpt-response-review/"><link rel="stylesheet" href="/prompt-studio/academy.css"><style>fieldset{border:1px solid #ccc;border-radius:10px;margin:14px 0}textarea{max-width:100%}fieldset .grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1133894458639371" crossorigin="anonymous"></script></head><body><header><nav><a href="/tools/#ai">دليل الأدوات</a><a href="/prompt-studio/">مختبر ChatGPT</a><a href="/prompt-studio/course/">الكورس</a></nav></header><main><h1>مقارنة إجابات ChatGPT</h1><p>قيّم نسختين بأوزان الدقة والاكتمال والوضوح واحفظ تقرير المفاضلة.</p><form class="box" id="form"><label for="goal">المهمة المطلوبة</label><textarea id="goal" rows="3"></textarea><div class="grid"><div><label for="a">الإجابة أ</label><textarea id="a" rows="3"></textarea></div><div><label for="b">الإجابة ب</label><textarea id="b" rows="3"></textarea></div></div><fieldset><legend>الدقة</legend><div class="grid"><label>الوزن<input type="number" min="0" max="100" required id="n00" value="50"></label><label>درجة أ من 5<input type="number" min="0" max="5" required id="n01" ></label><label>درجة ب من 5<input type="number" min="0" max="5" required id="n02" ></label></div></fieldset><fieldset><legend>الاكتمال</legend><div class="grid"><label>الوزن<input type="number" min="0" max="100" required id="n10" value="30"></label><label>درجة أ من 5<input type="number" min="0" max="5" required id="n11" ></label><label>درجة ب من 5<input type="number" min="0" max="5" required id="n12" ></label></div></fieldset><fieldset><legend>الوضوح</legend><div class="grid"><label>الوزن<input type="number" min="0" max="100" required id="n20" value="20"></label><label>درجة أ من 5<input type="number" min="0" max="5" required id="n21" ></label><label>درجة ب من 5<input type="number" min="0" max="5" required id="n22" ></label></div></fieldset><label for="reason">سبب تفضيلك لإحدى الإجابتين</label><textarea id="reason" rows="3"></textarea><button>احسب المقارنة</button></form><output id="msg" aria-live="polite"></output><section id="panel" class="box" hidden><label for="out">النتيجة القابلة للتعديل</label><textarea id="out" rows="12"></textarea><button id="copy">نسخ</button><button id="save">تنزيل نص</button></section></main><script>const el=id=>document.getElementById(id);function need(id){const v=el(id).value.trim();if(!v){el(id).focus();throw Error('أكمل الحقل المحدد ثم أعد المحاولة.')}return v}function clear(){el('panel').hidden=true;el('out').value='';el('msg').textContent=''}el('form').addEventListener('input',clear);el('form').onsubmit=e=>{e.preventDefault();clear();try{el('out').value=generate();el('panel').hidden=false;el('msg').textContent='النتيجة جاهزة للمراجعة.'}catch(e){el('msg').textContent=e.message}};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('out').value);el('msg').textContent='تم النسخ.'}catch{el('out').select();el('msg').textContent='تم تحديد النص. استخدم أمر النسخ.'}};el('save').onclick=()=>{const url=URL.createObjectURL(new Blob([el('out').value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};function generate(){const goal=need('goal'),a=need('a'),b=need('b');let sums=[0,0],total=0,report=[];['الدقة','الاكتمال','الوضوح'].forEach((name,i)=>{const [w,x,y]=[0,1,2].map(j=>Number(need('n'+i+j)));total+=w;sums[0]+=w*x;sums[1]+=w*y;report.push(name+' | الوزن '+w+' | أ '+x+'/5 | ب '+y+'/5')});if(!total)throw Error('أدخل وزنًا موجبًا لمعيار واحد على الأقل.');return [goal,...report,'الدرجة = مجموع (الوزن × الدرجة) ÷ مجموع الأوزان × 20','أ '+(20*sums[0]/total).toFixed(1)+'/100 · ب '+(20*sums[1]/total).toFixed(1)+'/100',sums[0]===sums[1]?'تعادل وفق تقييمك':sums[0]>sums[1]?'تتقدم أ وفق تقييمك':'تتقدم ب وفق تقييمك','سبب الحكم: '+(el('reason').value||'غير مدوّن'),'الإجابة أ: '+a,'الإجابة ب: '+b].join('\n')}</script></body></html>
