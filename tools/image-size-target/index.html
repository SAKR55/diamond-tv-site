<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ضغط صورة إلى حجم محدد | DIAMOND HUB</title><meta name="description" content="حدّد أقصى حجم للصورة وأبعادها، وعاين النتيجة ثم نزّلها."><link rel="canonical" href="https://diamond-tv.shop/tools/image-size-target/"><link rel="stylesheet" href="/prompt-studio/academy.css"><style>figure{margin:12px 0}figure img{max-width:100%;max-height:480px;object-fit:contain}pre{direction:rtl;white-space:pre-wrap}#people{display:flex;gap:14px;flex-wrap:wrap}[hidden]{display:none!important}</style></head><body><header><nav><a href="/">DIAMOND HUB</a><a href="/tools/">دليل الأدوات</a><a href="/articles/">المقالات</a></nav></header><main><h1>ضغط صورة إلى حجم محدد</h1><p>حدّد أقصى حجم للصورة وأبعادها، وعاين النتيجة ثم نزّلها.</p><form class="box" id="work"><label>اختر صورة ثابتة بصيغة JPEG أو PNG أو WebP<input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><div class="grid"><label>الحد الأقصى بالكيلوبايت (1024 بايت)<input type="number" id="kb" value="500" min="1" max="50000" required></label><label>أطول ضلع بالبكسل<input type="number" id="side" value="1600" min="32" max="4096" required></label><label>صيغة التنزيل<select id="type"><option value="image/jpeg">JPEG · خلفية بيضاء</option><option value="image/webp">WebP · يحتفظ بالشفافية</option></select></label></div><button>اضغط وعاين</button><figure id="preview" hidden><img id="pic" alt="معاينة الصورة المضغوطة"><figcaption id="stats"></figcaption></figure></form><output id="msg" aria-live="polite"></output><a id="download" class="action" hidden>نزّل النتيجة</a><p><a href="/articles/compress-image-for-upload/">كيف تصغّر صورة لتناسب حد الرفع وتبقى واضحة؟</a></p></main><script>const el=id=>document.getElementById(id);const form=el('work');let version=0,url='';function clearResult(){version++;if(url)URL.revokeObjectURL(url);url='';el('download').hidden=true;el('msg').textContent='';for(const id of ['statement','preview'])if(el(id))el(id).hidden=true}function ready(blob,name){url=URL.createObjectURL(blob);el('download').href=url;el('download').download=name;el('download').hidden=false}form.addEventListener('input',clearResult);form.onsubmit=async e=>{e.preventDefault();clearResult();const job=version;try{await run(job)}catch(error){if(job===version)el('msg').textContent=error.message}};function report(text){el('statement').textContent=text;el('statement').hidden=false}function requireNumber(id){const s=el(id).value.trim();if(!s||!Number.isFinite(Number(s)))throw Error('أكمل الحقول الرقمية المطلوبة.');return Number(s)};async function run(job){const file=el('file').files[0],mime=el('type').value,cap=requireNumber('kb')*1024,side=requireNumber('side');if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('اختر صورة JPEG أو PNG أو WebP ثابتة.');const source=URL.createObjectURL(file),img=new Image();try{img.src=source;await img.decode()}catch{throw Error('تعذرت قراءة الصورة.')}finally{URL.revokeObjectURL(source)}if(job!==version)return;let factor=Math.min(1,side/Math.max(img.width,img.height));let output,w,h;const canvas=document.createElement('canvas');const encode=q=>new Promise((resolve,reject)=>canvas.toBlob(b=>b&&b.type===mime?resolve(b):reject(Error('تعذّر الترميز بهذه الصيغة. جرّب JPEG.')),mime,q));el('msg').textContent='جارٍ ضبط الحجم…';for(let tries=0;tries<32;tries++){w=canvas.width=Math.max(1,Math.round(img.width*factor));h=canvas.height=Math.max(1,Math.round(img.height*factor));let ctx=canvas.getContext('2d');if(mime==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h)}ctx.drawImage(img,0,0,w,h);const low=await encode(.36);if(job!==version)return;if(low.size<=cap){output=low;let lo=.36,hi=.96;for(let n=0;n<7;n++){let q=(lo+hi)/2,b=await encode(q);if(job!==version)return;if(b.size<=cap){output=b;lo=q}else hi=q}break}if(w===1&&h===1)break;factor*=.78}if(!output)throw Error('تعذر بلوغ الحد بهذه الإعدادات. ارفع الحد وأعد التجربة.');ready(output,file.name.replace(/\.[^.]*$/,'')+'-small.'+(mime==='image/jpeg'?'jpg':'webp'));el('pic').src=url;el('stats').textContent='قبل: '+(file.size/1024).toFixed(1)+' كيلوبايت · بعد: '+(output.size/1024).toFixed(1)+' كيلوبايت · '+w+' × '+h+' بكسل';el('preview').hidden=false;el('msg').textContent='الصورة جاهزة للتنزيل.'}</script></body></html>
