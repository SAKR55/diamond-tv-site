name: Build Mugharrid APK
on:
  workflow_dispatch:
  push:
    paths: ['mugharrid-app/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mugharrid-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart setup.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mugharrid-apk
          path: mugharrid-app/build/app/outputs/flutter-apk/app-release.apk
