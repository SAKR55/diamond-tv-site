name: Refresh Saudi Google Trends

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-trends.yml"
      - "scripts/update-google-trends.py"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-trends-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch and filter the Trends feed
        run: python scripts/update-google-trends.py
      - name: Save updated topics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/google-trends.json
          if git diff --cached --quiet; then
            echo "No relevant Trends changes."
            exit 0
          fi
          git commit -m "chore: refresh Saudi Google Trends"
          git pull --rebase origin main
          git push origin HEAD:main

