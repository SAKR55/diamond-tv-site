name: Import public product metadata

on:
  repository_dispatch:
    types: [product-import]

permissions:
  contents: write

concurrency:
  group: product-import-${{ github.event.client_payload.request_id }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read public product metadata
        env:
          PRODUCT_URL: ${{ github.event.client_payload.source_url }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: python scripts/import-product.py
      - name: Save import result for the admin
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/product-imports/${REQUEST_ID}.json"
          if git diff --cached --quiet; then
            echo "No product import result was written."
            exit 1
          fi
          git commit -m "chore: save product import result"
          git pull --rebase origin main
          git push origin HEAD:main
