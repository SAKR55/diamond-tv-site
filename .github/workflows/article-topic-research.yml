name: Research a requested article topic

on:
  repository_dispatch:
    types: [article-research, article-link-check]

permissions:
  contents: write

concurrency:
  group: article-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Search trusted publisher feeds
        if: github.event.action == 'article-research'
        env:
          TOPIC: ${{ github.event.client_payload.topic }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: python scripts/update-google-trends.py research-topic "$TOPIC" "$REQUEST_ID"
      - name: Check article source links
        if: github.event.action == 'article-link-check'
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          LINKS_JSON: ${{ toJson(github.event.client_payload.urls) }}
        run: python scripts/update-google-trends.py check-links "$REQUEST_ID"
      - name: Save article research results
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/article-research/${REQUEST_ID}.json"
          if git diff --cached --quiet; then
            echo "No research output was written."
            exit 1
          fi
          git commit -m "chore: save article research results"
          git push origin HEAD:main
