name: kalima_english
description: "كلمة: تطبيق تعليم الإنجليزية للعرب، بقسم للأطفال وقسم للكبار."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # حفظ التقدم على الجهاز
  shared_preferences: ^2.2.0
  # نطق الجمل الإنجليزية من الجوال نفسه (بلا إنترنت وبلا تكلفة)
  flutter_tts: ^4.0.0
  # تشغيل أصوات سحابية من رابط تحدده من لوحة التحكم (اختياري)
  audioplayers: ^6.0.0
  # تحويل كلام المتعلم إلى نص من الجوال نفسه
  speech_to_text: ^7.0.0
  # التذكير اليومي. مثبت على الإصدار 19 لأن الإصدار 20 غيّر طريقة الاستدعاء
  flutter_local_notifications: ^19.0.0
  timezone: any
  # الاتصال بخادم الذكاء الاصطناعي عند ربطه (اختياري)
  http: ^1.2.0
  # الحسابات والاشتراكات بالأكواد
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  # المكالمات الصوتية بين الأصدقاء
  flutter_webrtc: any
  # زر واتساب والبريد
  url_launcher: any
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
